{% extends "base.html" %}

{% block title %}Servo Control{% endblock %}

{% block extra_css %}
    <style>
        .servo-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .slider-container {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .slider-container label span {
            font-weight: bold;
            color: #667eea;
            font-size: 1.2rem;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        #status {
            background: #e3f2fd;
            color: #1976d2;
            font-weight: 500;
        }

        #status:empty {
            display: none;
        }

        @media (max-width: 968px) {
            .servo-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="card">
        <h1>Servo Motor Control</h1>

        <div style="margin-bottom: 2rem;">
            <label for="device-select">Select Device:</label>
            <select id="device-select">
                <option value="">-- Select a device --</option>
                {% for device in devices %}
                    <option value="{{ device.id }}" data-channel="{{ device.chanel_name }}"
                            {% if selected_device and device.id == selected_device.id %}selected{% endif %}>
                        Device ID: {{ device.id }} - Channel: {{ device.chanel_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="servo-container">
            <div class="control-panel">
                <div class="slider-container">
                    <label for="x-slider">
                        X-Axis: <span id="x-value">0</span>°
                    </label>
                    <input
                            type="range"
                            id="x-slider"
                            min="-90"
                            max="90"
                            value="0"
                            step="1"
                    />
                    <div class="slider-labels">
                        <span>-90°</span>
                        <span>0°</span>
                        <span>90°</span>
                    </div>
                </div>

                <div class="slider-container">
                    <label for="y-slider">
                        Y-Axis: <span id="y-value">0</span>°
                    </label>
                    <input
                            type="range"
                            id="y-slider"
                            min="-90"
                            max="90"
                            value="0"
                            step="1"
                    />
                    <div class="slider-labels">
                        <span>-90°</span>
                        <span>0°</span>
                        <span>90°</span>
                    </div>
                </div>

                <div id="status"></div>
            </div>

            <div class="video-container">
                <img src='{{ url_for('video.get_next_frame') }}'
                     id="video-screen" alt="video-screen"/>
            </div>
        </div>
    </div>

    <script>
        const deviceSelect = document.getElementById('device-select');
        const controls = document.getElementById('controls');
        const xSlider = document.getElementById('x-slider');
        const ySlider = document.getElementById('y-slider');
        const xValue = document.getElementById('x-value');
        const yValue = document.getElementById('y-value');
        const status = document.getElementById('status');

        let currentChannel = null;
        let publishTimeout = null;

        deviceSelect.addEventListener('change', function () {
            const selectedOption = this.options[this.selectedIndex];
            currentChannel = selectedOption.dataset.channel;

            if (currentChannel) {
                xSlider.value = 0;
                ySlider.value = 0;
                xValue.textContent = '0';
                yValue.textContent = '0';
            } else {
                currentChannel = null;
            }
        });

        function updateAndPublish() {
            if (!currentChannel) return;

            const xAxis = parseInt(xSlider.value);
            const yAxis = parseInt(ySlider.value);

            xValue.textContent = xAxis;
            yValue.textContent = yAxis;

            if (publishTimeout) {
                clearTimeout(publishTimeout);
            }

            publishTimeout = setTimeout(() => {
                publishServoPosition(xAxis, yAxis);
            }, 100);
        }

        xSlider.addEventListener('input', updateAndPublish);
        ySlider.addEventListener('input', updateAndPublish);

        async function publishServoPosition(xAxis, yAxis) {
            if (!currentChannel) return;

            status.textContent = 'Publishing...';

            try {
                const response = await fetch('/control/api/publish-servo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        channel_name: currentChannel,
                        x_axis: xAxis,
                        y_axis: yAxis
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    status.textContent = `Published: X=${xAxis}°, Y=${yAxis}°`;
                } else {
                    status.textContent = `Error: ${data.error || 'Failed to publish'}`;
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
            }

            setTimeout(() => {
                status.textContent = '';
            }, 3000);
        }

        if (deviceSelect.value) {
            const selectedOption = deviceSelect.options[deviceSelect.selectedIndex];
            currentChannel = selectedOption.dataset.channel;
        }
    </script>
{% endblock %}
