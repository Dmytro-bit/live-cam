services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 1m30s
      timeout: 10s
      retries: 3
